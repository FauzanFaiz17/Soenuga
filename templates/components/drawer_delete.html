<div id="drawer-delete"
 class="fixed top-0 right-0 z-40 w-full h-screen max-w-xs p-4 overflow-y-auto transition-transform translate-x-full bg-white dark:bg-gray-800"
 tabindex="-1">

<h5 class="text-sm font-semibold text-gray-500 uppercase dark:text-gray-400">
 Delete Item
</h5>

<button type="button"
 data-drawer-dismiss="drawer-delete"
 class="absolute top-2.5 right-2.5 p-1.5 text-gray-400">

</button>

<svg class="w-10 h-10 mt-8 mb-4 text-red-600"

</a>

<button data-drawer-dismiss="drawer-delete"

</button>

</div>
